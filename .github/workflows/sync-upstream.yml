name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Akioss/open-ai-canvas'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream ddcat-ai/open-ai-canvas into main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
